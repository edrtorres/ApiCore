name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ApiCore.sln

      - name: Build
        run: dotnet build ApiCore.sln -c Release --no-restore

      - name: Test
        run: |
          dotnet test ApiCore.sln -c Release --no-build --verbosity normal || true

      - name: List artifacts
        run: ls -R || true
