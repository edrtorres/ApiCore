name: Deploy Supabase Functions

on:
  push:
    paths:
      - 'supabase/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install supabase CLI
        run: |
          npm install -g supabase

      - name: Login to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo $SUPABASE_ACCESS_TOKEN | supabase login --access-token

      - name: Deploy functions
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy login --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions deploy login-by-phone --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions deploy register --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions deploy me --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions deploy logout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions deploy process-auth --project-ref $SUPABASE_PROJECT_REF || true

      - name: Run migrations (optional)
        if: ${{ secrets.SUPABASE_DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          echo "Running migration SQL"
          psql "$DATABASE_URL" -f supabase/migrations/001_create_auth_and_logs.sql
